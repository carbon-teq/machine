    <script data-marimo="true">
      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "notebook": {"cells": [{"code": "", "code_hash": "42e029cf3a5d39c62d28528b3a4fc702", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "Hbol", "name": "_"}, {"code": "", "code_hash": "2a87a65ee946e07bee598669197fe53f", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "MJUe", "name": "_"}, {"code": "", "code_hash": "0ef73298bb2bd4ffe4bb64fae777da16", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "vblA", "name": "_"}, {"code": "", "code_hash": "b6840165fd4e400abc9b32b558a66af3", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "bkHC", "name": "_"}, {"code": "", "code_hash": "82f482a5101caab2a4e9c4eb5f5f3db3", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "lEQa", "name": "_"}, {"code": "", "code_hash": "c7373f56fd5d2567a7a101124efc547e", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "PKri", "name": "_"}, {"code": "", "code_hash": "b6ed41addeac4149078abfe55d215eac", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "Xref", "name": "_"}, {"code": "", "code_hash": "14892e76b20f3f910e48438866d4f0b1", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "SFPL", "name": "_"}, {"code": "", "code_hash": "6967a63307abf596a1e280c9d8f3dc34", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "BYtC", "name": "_"}, {"code": "", "code_hash": "50c71a57a8d4e29a12bb9f1143a408eb", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "RGSE", "name": "_"}], "metadata": {"marimo_version": "0.20.4"}, "version": "1"},
            "session": {"cells": [{"code_hash": "42e029cf3a5d39c62d28528b3a4fc702", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "2a87a65ee946e07bee598669197fe53f", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"visualizing-3d-surfaces\"\u003EVisualizing 3D Surfaces\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003EWelcome to the third dimension! In single-variable calculus, we studied functions like \u003Cmarimo-tex class=\"arithmatex\"\u003E||(y = f(x)||)\u003C/marimo-tex\u003E, which are curves on a 2D plane.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EIn multivariable calculus, we study functions like \u003Cmarimo-tex class=\"arithmatex\"\u003E||(z = f(x, y)||)\u003C/marimo-tex\u003E. These are \u003Cstrong\u003Esurfaces\u003C/strong\u003E in 3D space.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThink of \u003Cmarimo-tex class=\"arithmatex\"\u003E||(x||)\u003C/marimo-tex\u003E and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(y||)\u003C/marimo-tex\u003E as coordinates on a map (Longitude and Latitude), and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(z||)\u003C/marimo-tex\u003E as the \u003Cstrong\u003Ealtitude\u003C/strong\u003E at that location.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "0ef73298bb2bd4ffe4bb64fae777da16", "console": [], "id": "vblA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"the-paraboloid-the-bowl\"\u003EThe Paraboloid (The Bowl)\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003ELet's start with a classic shape: \u003Cmarimo-tex class=\"arithmatex\"\u003E||(z = x^2 + y^2||)\u003C/marimo-tex\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThis is called a \u003Cstrong\u003EParaboloid\u003C/strong\u003E. It looks like a bowl.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "b6840165fd4e400abc9b32b558a66af3", "console": [], "id": "bkHC", "outputs": [{"data": {"text/html": "\u003Cmarimo-plotly data-figure='{\u0026quot;data\u0026quot;:[{\u0026quot;x\u0026quot;:{\u0026quot;dtype\u0026quot;:\u0026quot;f8\u0026quot;,\u0026quot;bdata\u0026quot;:\u0026quot;AAAAAAAAFMDMKXg5BS8TwJhT8HIKXhLAY31orA+NEcAvp+DlFLwQwPahsT401g/AjfWhsT40DsAkSZIkSZIMwLycgpdT8ArAVPByCl5OCcDrQ2N9aKwHwIKXU/ByCgbAGutDY31oBMCyPjTWh8YCwEmSJEmSJAHAwMspeDkF/7/wcgpeTsH7vyAa60Njffi/TsHLKXg59b98aKwPjfXxv1gfGutDY+2/uG3btm3b5r8QvJyCl1Pgv+AUvJyCl9O/gMb60Fgfur+AxvrQWB+6P+AUvJyCl9M/GLycgpdT4D+4bdu2bdvmP1gfGutDY+0/gGisD4318T9QwcspeDn1PyAa60Njffg/8HIKXk7B+z/Ayyl4OQX/P0qSJEmSJAFAsj401ofGAkAa60NjfWgEQISXU/ByCgZA7ENjfWisB0BU8HIKXk4JQLycgpdT8ApAJEmSJEmSDECM9aGxPjQOQPihsT401g9AMKfg5RS8EEBkfWisD40RQJhT8HIKXhJAzCl4OQUvE0AAAAAAAAAUQAAAAAAAABTAzCl4OQUvE8CYU/ByCl4SwGN9aKwPjRHAL6fg5RS8EMD2obE+NNYPwI31obE+NA7AJEmSJEmSDMC8nIKXU/AKwFTwcgpeTgnA60NjfWisB8CCl1PwcgoGwBrrQ2N9aATAsj401ofGAsBJkiRJkiQBwMDLKXg5Bf+/8HIKXk7B+78gGutDY334v07Byyl4OfW/fGisD4318b9YHxrrQ2Ptv7ht27Zt2+a/ELycgpdT4L/gFLycgpfTv4DG+tBYH7q/gMb60Fgfuj/gFLycgpfTPxi8nIKXU+A/uG3btm3b5j9YHxrrQ2PtP4BorA+N9fE/UMHLKXg59T8gGutDY334P/ByCl5Owfs/wMspeDkF/z9KkiRJkiQBQLI+NNaHxgJAGutDY31oBECEl1PwcgoGQOxDY31orAdAVPByCl5OCUC8nIKXU/AKQCRJkiRJkgxAjPWhsT40DkD4obE+NNYPQDCn4OUUvBBAZH1orA+NEUCYU/ByCl4SQMwpeDkFLxNAAAAAAAAAFEAAAAAAAAAUwMwpeDkFLxPAmFPwcgpeEsBjfWisD40RwC+n4OUUvBDA9qGxPjTWD8CN9aGxPjQOwCRJkiRJkgzAvJyCl1PwCsBU8HIKXk4JwOtDY31orAfAgpdT8HIKBsAa60NjfWgEwLI+NNaHxgLASZIkSZIkAcDAyyl4OQX/v/ByCl5Owfu/IBrrQ2N9+L9OwcspeDn1v3xorA+N9fG/WB8a60Nj7b+4bdu2bdvmvxC8nIKXU+C/4BS8nIKX07+AxvrQWB+6v4DG+tBYH7o/4BS8nIKX0z8YvJyCl1PgP7ht27Zt2+Y/WB8a60Nj7T+AaKwPjfXxP1DByyl4OfU/IBrrQ2N9+D/wcgpeTsH7P8DLKXg5Bf8/SpIkSZIkAUCyPjTWh8YCQBrrQ2N9aARAhJdT8HIKBkDsQ2N9aKwHQFTwcgpeTglAvJyCl1PwCkAkSZIkSZIMQIz1obE+NA5A+KGxPjTWD0Awp+DlFLwQQGR9aKwPjRFAmFPwcgpeEkDMKXg5BS8TQAAAAAAAABRAAAAAAAAAFMDMKXg5BS8TwJhT8HIKXhLAY31orA+NEcAvp+DlFLwQwPahsT401g/Aj interactive-surface-explorer\"\u003EInteractive Surface Explorer\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003ETry changing the parameters \u003Cmarimo-tex class=\"arithmatex\"\u003E||(a||)\u003C/marimo-tex\u003E and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(b||)\u003C/marimo-tex\u003E in the function:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nz = a \\cdot x^2 + b \\cdot y^2\n||]\u003C/marimo-tex\u003E\u003Ch3 id=\"your-missions\"\u003E\ud83c\udfaf Your Missions:\u003C/h3\u003E\n\u003Col\u003E\n\u003Cli\u003E\u003Cstrong\u003EMake a Bowl (Valley):\u003C/strong\u003E Set both \u003Cmarimo-tex class=\"arithmatex\"\u003E||(a||)\u003C/marimo-tex\u003E and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(b||)\u003C/marimo-tex\u003E to positive numbers (e.g., \u003Cmarimo-tex class=\"arithmatex\"\u003E||(1.0||)\u003C/marimo-tex\u003E). In ML, we want to find the bottom of this bowl (Minimum Error).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EMake a Hill (Peak):\u003C/strong\u003E Set both \u003Cmarimo-tex class=\"arithmatex\"\u003E||(a||)\u003C/marimo-tex\u003E and \u003Cmarimo-tex class=\"arithmatex\"\u003E||(b||)\u003C/marimo-tex\u003E to negative numbers (e.g., \u003Cmarimo-tex class=\"arithmatex\"\u003E||(-1.0||)\u003C/marimo-tex\u003E).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EMake a Saddle:\u003C/strong\u003E Set one positive and one negative (e.g., \u003Cmarimo-tex class=\"arithmatex\"\u003E||(a=1.0, b=-1.0||)\u003C/marimo-tex\u003E). Notice how it goes UP in one direction and DOWN in the other? This is a \"Saddle Point\" and it's tricky for optimization algorithms!\u003C/li\u003E\n\u003C/ol\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "c7373f56fd5d2567a7a101124efc547e", "console": [], "id": "PKri", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: center;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='PKri e76b20f3f910e48438866d4f0b1", "console": [], "id": "SFPL", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch3 id=\"key-takeaways-for-machine-learning\"\u003EKey Takeaways for Machine Learning\u003C/h3\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003EThe Bowl (Convex):\u003C/strong\u003E This is the ideal shape for a Loss Function. Gradient Descent will easily roll down to the bottom (Global Minimum).\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003EThe Saddle (Non-Convex):\u003C/strong\u003E These are dangerous! A ball might get stuck on the flat part, or roll down the wrong side. Modern Deep Learning deals with millions of saddle points.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "6967a63307abf596a1e280c9d8f3dc34", "console": [], "id": "BYtC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"contour-plots-topographic-maps\"\u003EContour Plots (Topographic Maps)\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003ESometimes 3D is hard to read. A \u003Cstrong\u003EContour Plot\u003C/strong\u003E flattens the 3D surface into 2D lines.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EEach line represents a constant altitude (\u003Cmarimo-tex class=\"arithmatex\"\u003E||(z||)\u003C/marimo-tex\u003E).\u003C/li\u003E\n\u003Cli\u003EIf lines are close together, the slope is steep.\u003C/li\u003E\n\u003Cli\u003EIf lines are far apart, the ground is flat.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "50c71a57a8d4e29a12bb9f1143a408eb", "console": [], "id": "RGSE", "outputs": [{"data": {"text/html": "\u003Cmarimo-plotly data-figure='{\u0026quot;data\u0026quot;:[{\u0026quot;colorscale\u0026quot;:[[0.0,\u0026quot;#440154\u0026quot;],[0.1111111111111111,\u0026quot;#482878\u0026quot;],[0.2222222222222222,\u0026quot;#3e4989\u0026quot;],[0.3333333333333333,\u0026
