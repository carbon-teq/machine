    <script data-marimo="true">
      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "notebook": {"cells": [{"code": "", "code_hash": "42e029cf3a5d39c62d28528b3a4fc702", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "Hbol", "name": "_"}, {"code": "", "code_hash": "d730208308196fbd152cda1f5cdf5b21", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "MJUe", "name": "_"}, {"code": "", "code_hash": "746b736afd4a8ecfdcfe6e32183bb59c", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "vblA", "name": "_"}, {"code": "", "code_hash": "d1c49df0265bd23bbe49e1fdd97b9f98", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "bkHC", "name": "_"}, {"code": "", "code_hash": "56e589f6c79dc21b2b1c52f1b09268be", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "lEQa", "name": "_"}, {"code": "", "code_hash": "513fea8af414e3a28daeee82bcf0bbf8", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "PKri", "name": "_"}, {"code": "", "code_hash": "321e616c4e1f212801d8b3d0cd77ecab", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "Xref", "name": "_"}, {"code": "", "code_hash": "b60d7215db9dbaee8f30361b2dd49d3f", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "SFPL", "name": "_"}, {"code": "", "code_hash": "1aaf5649f7529eccd40a924cd9980214", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "BYtC", "name": "_"}, {"code": "", "code_hash": "c1459482b2d93cb4f694ace9e4729a0e", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "RGSE", "name": "_"}], "metadata": {"marimo_version": "0.20.4"}, "version": "1"},
            "session": {"cells": [{"code_hash": "42e029cf3a5d39c62d28528b3a4fc702", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "d730208308196fbd152cda1f5cdf5b21", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"partial-derivatives-slicing-the-mountain\"\u003EPartial Derivatives: Slicing the Mountain\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003EImagine you are standing on a mountain in heavy fog.\nYou know your exact location, but the only question that matters is:\n\u003Cstrong\u003E\"Which way gets me uphill fastest?\"\u003C/strong\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EIn single-variable calculus, there was only one path, so one derivative was enough.\nHere, the ground is a surface \u003Cmarimo-tex class=\"arithmatex\"\u003E||(z = f(x, y)||)\u003C/marimo-tex\u003E, so you can move in many directions.\nThat means \"the slope\" is no longer one number by default.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EPartial derivatives solve this by asking focused questions:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EIf we move only East/West (change \u003Cmarimo-tex class=\"arithmatex\"\u003E||(x||)\u003C/marimo-tex\u003E, keep \u003Cmarimo-tex class=\"arithmatex\"\u003E||(y||)\u003C/marimo-tex\u003E fixed), what slope do we feel?\u003C/li\u003E\n\u003Cli\u003EIf we move only North/South (change \u003Cmarimo-tex class=\"arithmatex\"\u003E||(y||)\u003C/marimo-tex\u003E, keep \u003Cmarimo-tex class=\"arithmatex\"\u003E||(x||)\u003C/marimo-tex\u003E fixed), what slope do we feel?\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EWe answer those questions by taking clean \u003Cstrong\u003Eslices\u003C/strong\u003E of the surface and measuring tangent-line slopes on each slice.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "746b736afd4a8ecfdcfe6e32183bb59c", "console": [], "id": "vblA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"build-intuition-first\"\u003EBuild Intuition First\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThink of the surface as a landscape:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cstrong\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(x||)\u003C/marimo-tex\u003E-direction slice:\u003C/strong\u003E freeze \u003Cmarimo-tex class=\"arithmatex\"\u003E||(y||)\u003C/marimo-tex\u003E, walk left/right, and read the slope on that cross-section.\u003C/li\u003E\n\u003Cli\u003E\u003Cstrong\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(y||)\u003C/marimo-tex\u003E-direction slice:\u003C/strong\u003E freeze \u003Cmarimo-tex class=\"arithmatex\"\u003E||(x||)\u003C/marimo-tex\u003E, walk forward/backward, and read the slope on that cross-section.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ENow we write this formally:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{\\partial f}{\\partial x}||)\u003C/marimo-tex\u003E: slope along the \u003Cmarimo-tex class=\"arithmatex\"\u003E||(x||)\u003C/marimo-tex\u003E direction while \u003Cmarimo-tex class=\"arithmatex\"\u003E||(y||)\u003C/marimo-tex\u003E is fixed.\u003C/li\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{\\partial f}{\\partial y}||)\u003C/marimo-tex\u003E: slope along the \u003Cmarimo-tex class=\"arithmatex\"\u003E||(y||)\u003C/marimo-tex\u003E direction while \u003Cmarimo-tex class=\"arithmatex\"\u003E||(x||)\u003C/marimo-tex\u003E is fixed.\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ESymbol Dictionary\u003C/strong\u003E\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(x, y||)\u003C/marimo-tex\u003E: horizontal coordinates (your map position)\u003C/li\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(z = f(x, y)||)\u003C/marimo-tex\u003E: altitude at that position\u003C/li\u003E\n\u003Cli\u003E\u003Cmarimo-tex class=\"arithmatex\"\u003E||(\\frac{\\partial f}{\\partial x}, \\frac{\\partial f}{\\partial y}||)\u003C/marimo-tex\u003E: directional slopes along coordinate axes\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ELet's apply this to a surface where both directions behave differently:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\nf(x, y) = x^2 - y^2\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThis is a \u003Cstrong\u003Esaddle\u003C/strong\u003E: moving in one direction bends upward, while moving in the other bends downward.\u003C/span\u003E\n\u003Cblockquote\u003E\n\u003Cspan class=\"paragraph\"\u003E[!TIP]\n\u003Cstrong\u003EML Relevance:\u003C/strong\u003E In optimization, this is exactly why training is hard in high dimensions.\nThe model can improve in one direction and get worse in another at the same point.\u003C/span\u003E\n\u003C/blockquote\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d1c49df0265bd23bbe49e1fdd97b9f98", "console": [], "id": "bkHC", "outputs": [{"data": {"text/html": "\u003Cmarimo-plotly data-figure='{\u0026quot;data\u0026quot;:[{\u0026quot;name\u0026quot;:\u0026quot;Surface\u0026quot;,\u0026quot;opacity\u0026quot;:0.8,\u0026quot;showscale\u0026quot;:false,\u0026quot;x\u0026quot;:{\u0026quot;dtype\u0026quot;:\u0026quot;f8\u0026quot;,\u0026quot;bdata\u0026quot;:\u0026quot;AAAAAAAAAMCsD431obH+v1kfGutDY/2/BS+n4OUU/L+yPjTWh8b6v15OwcspePm/Cl5Owcsp+L+3bdu2bdv2v2R9aKwPjfW/EI31obE+9L+8nIKXU/Dyv2msD431ofG/FbycgpdT8L+El1Pwcgruv9y2bdu2beu/NtaHxvrQ6L+O9aGxPjTmv+YUvJyCl+O/QDTWh8b64L8wp+DlFLzcv+TlFLycgte/lCRJkiRJ0r+QxvrQWB/Kv+CHxvrQWL+/QAUvp+DlpL9ABS+n4OWkP8CHxvrQWL8/gMb60Fgfyj+QJEmSJEnSP+DlFLycgtc/KKfg5RS83D88NNaHxvrgP+QUvJyCl+M/jPWhsT405j801ofG+tDoP9i2bdu2bes/gJdT8HIK7j8UvJyCl1PwP2isD431ofE/upyCl1Pw8j
