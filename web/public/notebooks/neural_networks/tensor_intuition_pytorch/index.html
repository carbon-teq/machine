      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

: null, "disabled": false, "hide_code": false}, "id": "Hstk", "name": "_"}, {"code": "", "code_hash": "dbfb2611388657a14c98f9aa019af465", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "nWHF", "name": "_"}], "metadata": {"marimo_version": "0.20.4"}, "version": "1"},
            "session": {"cells": [{"code_hash": "a45ef667a8a3d126da6fc0b60fcb6d3e", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "1f08b8da47aee2c134d642d01edfb0e0", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"tensor-intuition-in-pytorch\"\u003ETensor Intuition in PyTorch\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003EThis notebook keeps the code visible on purpose.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe goal is not to memorize PyTorch syntax. The goal is to build one clear picture:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003Ea \u003Cstrong\u003Etensor\u003C/strong\u003E is a container of numbers with a shape\u003C/li\u003E\n\u003Cli\u003Eshapes tell us how data is organized\u003C/li\u003E\n\u003Cli\u003EPyTorch gives us direct operations for indexing, dot products, and matrix multiplication\u003C/li\u003E\n\u003Cli\u003Efor these examples, we stay on the \u003Cstrong\u003ECPU\u003C/strong\u003E so the ideas stay simple\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003ERead the code, run your eye over the shapes, and connect each operation to the kind of object it acts on.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "067876ffcf8d07a4cf31835507626916", "console": [], "id": "vblA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"the-architecture-of-data\"\u003EThe Architecture of Data\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EA tensor is simply a container of numbers with a specific \u003Cstrong\u003Eshape\u003C/strong\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EInstead of thinking of tensors as advanced mathematical objects, think of them as the physical layout of your data. The shape tells us exactly how the numbers are arranged.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d7c2d5b8da0cf412ee80f16860ec1185", "console": [], "id": "bkHC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "7ecbe141091048aba333efbd8c264009", "console": [], "id": "lEQa", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EWhen you see a shape like \u003Ccode\u003E(4, 2)\u003C/code\u003E, it is telling you a story:\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003EWe are processing \u003Ccode\u003E4\u003C/code\u003E examples simultaneously.\u003C/li\u003E\n\u003Cli\u003EEach example has \u003Ccode\u003E2\u003C/code\u003E distinct features.\u003C/li\u003E\n\u003C/ul\u003E\u003C/span\u003E\u003Cmarimo-ui-element object-id='lEQa-0' random-id='6e16570d-5adf-b396-b0a4-6b1d7407e4f7'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='null' data-data='\u0026quot;[{\u0026#92;\u0026quot;name\u0026#92;\u0026quot;:\u0026#92;\u0026quot;scalar\u0026#92;\u0026quot;,\u0026#92;\u0026quot;shape\u0026#92;\u0026quot;:\u0026#92;\u0026quot;()\u0026#92;\u0026quot;,\u0026#92;\u0026quot;example\u0026#92;\u0026quot;:\u0026#92;\u0026quot;tensor(3.)\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;name\u0026#92;\u0026quot;:\u0026#92;\u0026quot;vector\u0026#92;\u0026quot;,\u0026#92;\u0026quot;shape\u0026#92;\u0026quot;:\u0026#92;\u0026quot;(3,)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;example\u0026#92;\u0026quot;:\u0026#92;\u0026quot;tensor([   3.,    2., 1500.])\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;name\u0026#92;\u0026quot;:\u0026#92;\u0026quot;batch\u0026#92;\u0026quot;,\u0026#92;\u0026quot;shape\u0026#92;\u0026quot;:\u0026#92;\u0026quot;(4, 2)\u0026#92;\u0026quot;,\u0026#92;\u0026quot;example\u0026#92;\u0026quot;:\u0026#92;\u0026quot;tensor([[3., 2.],\u0026#92;\u0026#92;n        [4., 3.],\u0026#92;\u0026#92;n        [2., 1.],\u0026#92;\u0026#92;n        [5., 4.]])\u0026#92;\u0026quot;}]\u0026quot;' data-total-rows='3' data-total-columns='3' data-max-columns='50' data-banner-text='\u0026quot;\u0026quot;' data-pagination='false' data-page-size='10' data-selection='\u0026quot;multi\u0026quot;' data-show-filters='false' data-show-download='false' data-show-column-summaries='false' data-show-data-types='true' data-show-page-size-selector='false' data-show-column-explorer='true' data-show-chart-builder='true' data-row-headers='[]' data-has-stable-row-id='false' data-lazy='false' data-preload='false' data-download-file-name='\u0026quot;rows\u0026quot;'\u003E\u003C/marimo-table\u003E\u003C/marimo-ui-element\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "bd6635010c780b5d211fe3c62938d446", "console": [], "id": "PKri", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"pointing-at-the-data\"\u003EPointing at the Data\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EOnce we have our data packed into a solid block, we need a way to point at specific pieces of it. Because tensors are structured, we can slice them exactly like grids.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "30f01e9f89244810e6235b933912fc84", "console": [], "id": "Xref", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "d04cc8644f6bc060efc4a0a9658c6968", "console": [], "id": "SFPL", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv class=\"language-python codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"n\"\u003Ebatch\u003C/span\u003E \u003Cspan class=\"o\"\u003E=\u003C/span\u003E \u003Cspan class=\"n\"\u003Etorch\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Etensor\u003C/span\u003E\u003Cspan class=\"p\"\u003E([\u003C/span\u003E\n    \u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"mf\"\u003E3.0\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mf\"\u003E2.0\u003C/span\u003E\u003Cspan class=\"p\"\u003E],\u003C/span\u003E\n    \u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"mf\"\u003E4.0\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mf\"\u003E3.0\u003C/span\u003E\u003Cspan class=\"p\"\u003E],\u003C/span\u003E\n    \u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"mf\"\u003E2.0\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mf\"\u003E1.0\u003C/span\u003E\u003Cspan class=\"p\"\u003E],\u003C/span\u003E\n    \u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"mf\"\u003E5.0\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mf\"\u003E4.0\u003C/span\u003E\u003Cspan class=\"p\"\u003E],\u003C/span\u003E\n\u003Cspan class=\"p\"\u003E])\u003C/span\u003E\n\n\u003Cspan class=\"n\"\u003Ebatch\u003C/span\u003E\u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"mi\"\u003E0\u003C/span\u003E\u003Cspan class=\"p\"\u003E]\u003C/span\u003E      \u003Cspan class=\"c1\"\u003E# first house\u003C/span\u003E\n\u003Cspan class=\"n\"\u003Ebatch\u003C/span\u003E\u003Cspan class=\"p\"\u003E[:,\u003C/span\u003E \u003Cspan class=\"mi\"\u003E1\u003C/span\u003E\u003Cspan class=\"p\"\u003E]\u003C/span\u003E   \u003Cspan class=\"c1\"\u003E# second feature (all houses)\u003C/span\u003E\n\u003Cspan class=\"n\"\u003Ebatch\u003C/span\u003E\u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"mi\"\u003E2\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mi\"\u003E0\u003C/span\u003E\u003Cspan class=\"p\"\u003E]\u003C/span\u003E   \u003Cspan class=\"c1\"\u003E# first feature of third house\u003C/span\u003E\n\u003Cspan class=\"n\"\u003Ebatch\u003C/span\u003E\u003Cspan class=\"p\"\u003E[:\u003C/span\u003E\u003Cspan class=\"mi\"\u003E2\u003C/span\u003E\u003Cspan class=\"p\"\u003E]\u003C/span\u003E     \u003Cspan class=\"c1\"\u003E# first two houses\u003C/span\u003E\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cdiv class=\"language-python codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"n\"\u003Ebatch\u003C/span\u003E\u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"mi\"\u003E0\u003C/span\u003E\u003Cspan class=\"p\"\u003E]\u003C/span\u003E    \u003Cspan class=\"o\"\u003E-\u0026gt;\u003C/span\u003E \u003Cspan class=\"n\"\u003Etensor\u003C/span\u003E\u003Cspan class=\"p\"\u003E([\u003C/span\u003E\u003Cspan class=\"mf\"\u003E3.\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mf\"\u003E2.\u003C/span\u003E\u003Cspan class=\"p\"\u003E])\u003C/span\u003E\n\u003Cspan class=\"n\"\u003Ebatch\u003C/span\u003E\u003Cspan class=\"p\"\u003E[:,\u003C/span\u003E \u003Cspan class=\"mi\"\u003E1\u003C/span\u003E\u003Cspan class=\"p\"\u003E]\u003C/span\u003E \u003Cspan class=\"o\"\u003E-\u0026gt;\u003C/span\u003E \u003Cspan class=\"n\"\u003Etensor\u003C/span\u003E\u003Cspan class=\"p\"\u003E([\u003C/span\u003E\u003Cspan class=\"mf\"\u003E2.\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mf\"\u003E3.\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mf\"\u003E1.\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mf\"\u003E4.\u003C/span\u003E\u003Cspan class=\"p\"\u003E])\u003C/span\u003E\n\u003Cspan class=\"n\"\u003Ebatch\u003C/span\u003E\u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"mi\"\u003E2\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mi\"\u003E0\u003C/span\u003E\u003Cspan class=\"p\"\u003E]\u003C/span\u003E \u003Cspan class=\"o\"\u003E-\u0026gt;\u003C/span\u003E \u003Cspan class=\"mf\"\u003E2.0\u003C/span\u003E\n\u003Cspan class=\"n\"\u003Ebatch\u003C/span\u003E\u003Cspan class=\"p\"\u003E[:\u003C/span\u003E\u003Cspan class=\"mi\"\u003E2\u003C/span\u003E\u003Cspan class=\"p\"\u003E]\u003C/span\u003E   \u003Cspan class=\"o\"\u003E-\u0026gt;\u003C/span\u003E \u003Cspan class=\"n\"\u003Etensor\u003C/span\u003E\u003Cspan class=\"p\"\u003E([[\u003C/span\u003E\u003Cspan class=\"mf\"\u003E3.\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mf\"\u003E2.\u003C/span\u003E\u003Cspan class=\"p\"\u003E],\u003C/span\u003E\n        \u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"mf\"\u003E4.\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mf\"\u003E3.\u003C/span\u003E\u003Cspan class=\"p\"\u003E]])\u003C/span\u003E\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "19340cdc194ab33425f9fe69ba2f1751", "console": [], "id": "BYtC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"the-aha-moment-why-we-need\"\u003EThe \"Aha!\" Moment: Why We Need \u003Ccode\u003E@\u003C/code\u003E\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003ESuppose we have our batch of 4 houses, each with 2 features. We also have a set of \"weights\" that tell us how important each feature is. We want to multiply our houses by our weights to get a prediction.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "083cbbe70802e326dc8e58fb2c295b5c", "console": [], "id": "RGSE", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "7d6069faac90764c7bce7b887970e462", "console": [], "id": "Kclp", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EIf we try to use standard multiplication \u003Ccode\u003E*\u003C/code\u003E, PyTorch will try to match up the numbers element by element. \u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EWe don't want element-wise multiplication. We want to apply our \u003Ccode\u003E(2, 1)\u003C/code\u003E weights to \u003Cem\u003Eevery single row\u003C/em\u003E of our \u003Ccode\u003E(4, 2)\u003C/code\u003E batch simultaneously.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EWe need \u003Cstrong\u003EMatrix Multiplication\u003C/strong\u003E, represented in PyTorch by the \u003Ccode\u003E@\u003C/code\u003E symbol.\u003C/span\u003E\n\u003Cdiv class=\"language-python codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"n\"\u003Ebatch\u003C/span\u003E \u003Cspan class=\"o\"\u003E=\u003C/span\u003E \u003Cspan class=\"n\"\u003Etorch\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Etensor\u003C/span\u003E\u003Cspan class=\"p\"\u003E([\u003C/span\u003E\n    \u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"mf\"\u003E3.0\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mf\"\u003E2.0\u003C/span\u003E\u003Cspan class=\"p\"\u003E],\u003C/span\u003E\n    \u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"mf\"\u003E4.0\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mf\"\u003E3.0\u003C/span\u003E\u003Cspan class=\"p\"\u003E],\u003C/span\u003E\n    \u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"mf\"\u003E2.0\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mf\"\u003E1.0\u003C/span\u003E\u003Cspan class=\"p\"\u003E],\u003C/span\u003E\n    \u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"mf\"\u003E5.0\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mf\"\u003E4.0\u003C/span\u003E\u003Cspan class=\"p\"\u003E],\u003C/span\u003E\n\u003Cspan class=\"p\"\u003E])\u003C/span\u003E \u003Cspan class=\"c1\"\u003E# shape: (4, 2)\u003C/span\u003E\n\n\u003Cspan class=\"n\"\u003Eweights\u003C/span\u003E \u003Cspan class=\"o\"\u003E=\u003C/span\u003E \u003Cspan class=\"n\"\u003Etorch\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Etensor\u003C/span\u003E\u003Cspan class=\"p\"\u003E([\u003C/span\u003E\n    \u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"mf\"\u003E50.0\u003C/span\u003E\u003Cspan class=\"p\"\u003E],\u003C/span\u003E\n    \u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"mf\"\u003E25.0\u003C/span\u003E\u003Cspan class=\"p\"\u003E],\u003C/span\u003E\n\u003Cspan class=\"p\"\u003E])\u003C/span\u003E \u003Cspan class=\"c1\"\u003E# shape: (2, 1)\u003C/span\u003E\n\n\u003Cspan class=\"c1\"\u003E# Matrix Multiplication\u003C/span\u003E\n\u003Cspan class=\"n\"\u003Epredictions\u003C/span\u003E \u003Cspan class=\"o\"\u003E=\u003C/span\u003E \u003Cspan class=\"n\"\u003Ebatch\u003C/span\u003E \u003Cspan class=\"o\"\u003E@\u003C/span\u003E \u003Cspan class=\"n\"\u003Eweights\u003C/span\u003E\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cdiv class=\"language-python codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"n\"\u003Ebatch\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eshape\u003C/span\u003E   \u003Cspan class=\"o\"\u003E-\u0026gt;\u003C/span\u003E \u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"mi\"\u003E4\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mi\"\u003E2\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"n\"\u003Eweights\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eshape\u003C/span\u003E \u003Cspan class=\"o\"\u003E-\u0026gt;\u003C/span\u003E \u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"mi\"\u003E2\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mi\"\u003E1\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"n\"\u003Epredictions\u003C/span\u003E   \u003Cspan class=\"o\"\u003E-\u0026gt;\u003C/span\u003E \u003Cspan class=\"n\"\u003Etensor\u003C/span\u003E\u003Cspan class=\"p\"\u003E([[\u003C/span\u003E\u003Cspan class=\"mf\"\u003E200.\u003C/span\u003E\u003Cspan class=\"p\"\u003E],\u003C/span\u003E\n        \u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"mf\"\u003E275.\u003C/span\u003E\u003Cspan class=\"p\"\u003E],\u003C/span\u003E\n        \u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"mf\"\u003E125.\u003C/span\u003E\u003Cspan class=\"p\"\u003E],\u003C/span\u003E\n        \u003Cspan class=\"p\"\u003E[\u003C/span\u003E\u003Cspan class=\"mf\"\u003E350.\u003C/span\u003E\u003Cspan class=\"p\"\u003E]])\u003C/span\u003E\n\u003Cspan class=\"n\"\u003Epredictions\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eshape\u003C/span\u003E \u003Cspan class=\"o\"\u003E-\u0026gt;\u003C/span\u003E \u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"mi\"\u003E4\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mi\"\u003E1\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003ELook at what happens to the shapes:\u003C/span\u003E\n\u003Cmarimo-tex class=\"arithmatex\"\u003E||[\n(4, 2) @ (2, 1) \nightarrow (4, 1)\n||]\u003C/marimo-tex\u003E\u003Cspan class=\"paragraph\"\u003EThe inner dimensions (\u003Ccode\u003E2\u003C/code\u003E and \u003Ccode\u003E2\u003C/code\u003E) snap together and collapse. We are left with a shape of \u003Ccode\u003E(4, 1)\u003C/code\u003E: exactly 4 predictions, one for each house. We just processed the entire batch in a single operation, without a single \u003Ccode\u003Efor\u003C/code\u003E loop.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "d5cd303176bb23cebcce9a4083de12a0", "console": [], "id": "emfo", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"the-reality-check-adapting-shapes\"\u003EThe Reality Check: Adapting Shapes\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EIn the real world, your data rarely arrives in the exact perfect shape for matrix multiplication. Sometimes the numbers are right, but the Lego blocks won't snap together.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThis is why PyTorch gives us tools to bend and adapt our tensors:\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "7d2c567b3cc5e76ef6b3347a83285227", "console": [], "id": "Hstk", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "dbfb2611388657a14c98f9aa019af465", "console": [], "id": "nWHF", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv class=\"language-python codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"n\"\u003Ev\u003C/span\u003E \u003Cspan class=\"o\"\u003E=\u003C/span\u003E \u003Cspan class=\"n\"\u003Etorch\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Etensor\u003C/span\u003E\u003Cspan class=\"p\"\u003E([\u003C/span\u003E\u003Cspan class=\"mf\"\u003E1.0\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mf\"\u003E2.0\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mf\"\u003E3.0\u003C/span\u003E\u003Cspan class=\"p\"\u003E])\u003C/span\u003E\n\n\u003Cspan class=\"n\"\u003Ev\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eshape\u003C/span\u003E\n\u003Cspan class=\"n\"\u003Ev\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eunsqueeze\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"mi\"\u003E0\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eshape\u003C/span\u003E\n\u003Cspan class=\"n\"\u003Ev\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eunsqueeze\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"mi\"\u003E1\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eshape\u003C/span\u003E\n\u003Cspan class=\"n\"\u003Ev\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eunsqueeze\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"mi\"\u003E1\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003ET\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eshape\u003C/span\u003E\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cdiv class=\"language-python codehilite\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E\u003Cspan class=\"n\"\u003Ev\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eshape\u003C/span\u003E               \u003Cspan class=\"o\"\u003E-\u0026gt;\u003C/span\u003E \u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"mi\"\u003E3\u003C/span\u003E\u003Cspan class=\"p\"\u003E,)\u003C/span\u003E\n\u003Cspan class=\"n\"\u003Ev\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eunsqueeze\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"mi\"\u003E0\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eshape\u003C/span\u003E  \u003Cspan class=\"o\"\u003E-\u0026gt;\u003C/span\u003E \u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"mi\"\u003E1\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mi\"\u003E3\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"n\"\u003Ev\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eunsqueeze\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"mi\"\u003E1\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eshape\u003C/span\u003E  \u003Cspan class=\"o\"\u003E-\u0026gt;\u003C/span\u003E \u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"mi\"\u003E3\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mi\"\u003E1\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\n\u003Cspan class=\"n\"\u003Ev\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eunsqueeze\u003C/span\u003E\u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"mi\"\u003E1\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003ET\u003C/span\u003E\u003Cspan class=\"o\"\u003E.\u003C/span\u003E\u003Cspan class=\"n\"\u003Eshape\u003C/span\u003E \u003Cspan class=\"o\"\u003E-\u0026gt;\u003C/span\u003E \u003Cspan class=\"p\"\u003E(\u003C/span\u003E\u003Cspan class=\"mi\"\u003E1\u003C/span\u003E\u003Cspan class=\"p\"\u003E,\u003C/span\u003E \u003Cspan class=\"mi\"\u003E3\u003C/span\u003E\u003Cspan class=\"p\"\u003E)\u003C/span\u003E\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cul\u003E\n\u003Cli\u003E\u003Ccode\u003Eunsqueeze(0)\u003C/code\u003E adds a new axis in front\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003Eunsqueeze(1)\u003C/code\u003E adds a new axis after the first one\u003C/li\u003E\n\u003Cli\u003E\u003Ccode\u003E.T\u003C/code\u003E swaps rows and columns for a 2D tensor\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EWhenever a matrix multiplication fails with a \"shape mismatch\" error, your first instinct should be to check if you need to \u003Ccode\u003Eunsqueeze\u003C/code\u003E an axis or transpose (\u003Ccode\u003E.T\u003C/code\u003E) a matrix to make the inner dimensions line up.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.20.4", "script_metadata_hash": null}, "version": "1"},
